<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vesta</title>
<meta name="theme-color" content="#16130F" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
:root{
  --ground:#16130F; --surface:#1F1A15; --surface-2:#292219; --sunk:#100D0A;
  --line:#383026; --line-soft:#261F19;
  --ink:#F4EDE2; --ink-2:#B6A88F; --ink-3:#7E7263;
  --brass:#C6963F; --brass-soft:#6B5223; --glow:rgba(198,150,63,.16);
  --ok:#87A97F; --err:#C4664F; --err-bg:#2A1713;
  --f-display:Didot,"Bodoni 72","Bodoni MT",Georgia,serif;
  --f-ui:"Avenir Next","Avenir","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pad:18px;
  --sh-art:drop-shadow(0 18px 28px rgba(0,0,0,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.4));
  --sh-pop:0 24px 70px rgba(0,0,0,.65);
  --out:cubic-bezier(.16,1,.3,1); --quart:cubic-bezier(.25,1,.5,1);
}
:root[data-theme="light"]{
  --ground:#E9E6DF; --surface:#F6F4EF; --surface-2:#EEEBE3; --sunk:#DEDAD1;
  --line:#CFC8BA; --line-soft:#E0DACE; --ink:#191510; --ink-2:#5B5245; --ink-3:#8B8073;
  --brass:#9A6E1E; --brass-soft:#E4D3AE; --glow:rgba(154,110,30,.12);
  --err:#9B3C28; --err-bg:#F4E2DC;
  --sh-art:drop-shadow(0 14px 22px rgba(40,30,15,.16)); --sh-pop:0 24px 60px rgba(40,30,15,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.5;
  background-image:var(--grain);background-size:180px;mix-blend-mode:overlay}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
:focus-visible{outline:1.5px solid var(--brass);outline-offset:3px}
.meta{font-family:var(--f-num);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3);max-width:62ch}

/* ---------- struttura ---------- */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px var(--pad);
  border-bottom:1px solid var(--line-soft);flex:none}
.wm{font-family:var(--f-display);font-size:23px;letter-spacing:.02em;flex:none}
.top .sp{flex:1}
.switch{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:3px;
  position:relative}
.switch button{padding:7px 14px;border-radius:99px;font-size:12.5px;color:var(--ink-3);position:relative;z-index:1}
.switch button[aria-pressed="true"]{color:var(--ink)}
/* il cursore e' un elemento solo che scivola: niente sfondo che appare e sparisce */
.switch .cursore{position:absolute;top:3px;bottom:3px;left:0;border-radius:99px;background:var(--surface-2);
  z-index:0;will-change:transform,width}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok)} .dot.warn{background:var(--brass)} .dot.ko{background:var(--err)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.view{padding:var(--pad);max-width:1500px;margin:0 auto;width:100%}
[data-rivela]{opacity:0;transform:translateY(14px)}
[data-rivela].visto{opacity:1;transform:none;
  transition:opacity .5s var(--out) var(--ritardo,0ms),transform .5s var(--out) var(--ritardo,0ms)}
@media(prefers-reduced-motion:reduce){[data-rivela]{opacity:1;transform:none}}

/* ---------- camerino ---------- */
.room{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){
  .room{grid-template-columns:auto minmax(360px,1fr);gap:34px;align-items:start}
  .left{width:calc(64dvh * 3 / 4)}
}
.stage{position:relative;aspect-ratio:3/4;max-height:54dvh;margin-inline:auto;
  border:1px solid var(--line-soft);border-radius:6px;overflow:hidden;
  background:var(--sunk);display:flex;align-items:center;justify-content:center}
@media(min-width:1000px){ .stage{max-height:64dvh} }
/* la luce del camerino: un gradiente che si muove davvero, non un'immagine ferma */
.stage .luce{position:absolute;inset:-30%;z-index:0;pointer-events:none;will-change:transform;
  background:radial-gradient(38% 32% at 50% 50%,var(--surface) 0%,transparent 70%)}
.stage .alone{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(90% 60% at 50% 4%,rgba(255,255,255,.05),transparent 60%)}
.stage.calda{box-shadow:0 0 0 1px var(--brass),inset 0 0 70px var(--glow)}
.stage .filo{position:absolute;top:0;left:12%;right:12%;height:1px;z-index:6;
  background:linear-gradient(90deg,transparent,var(--brass),transparent);opacity:.5;
  transform-origin:left center;will-change:transform}
.fig{position:relative;height:100%;max-height:100%;max-width:100%;flex:none;z-index:1;will-change:transform}
.fig>.base{display:block;width:100%;height:100%;object-fit:contain}
.layer{position:absolute;object-fit:contain;object-position:center top;filter:var(--sh-art);
  pointer-events:none;z-index:2;will-change:transform}
.layer.shoes{object-position:center bottom}
.tag{position:absolute;top:10px;left:10px;z-index:7;font-family:var(--f-num);font-size:9px;
  text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);background:rgba(0,0,0,.42);
  border:1px solid var(--line-soft);border-radius:2px;padding:5px 8px;backdrop-filter:blur(8px)}
:root[data-theme="light"] .tag{background:rgba(255,255,255,.62)}
.stage .corner{position:absolute;top:8px;right:8px;z-index:7;display:flex;gap:6px}
.vuota{text-align:center;padding:24px;z-index:1;position:relative}
.vuota svg{opacity:.2}

/* --- lo sviluppo: qui i settantacinque secondi diventano guardabili --- */
.sviluppo{position:absolute;inset:0;z-index:4;pointer-events:none}
.sviluppo .anteprima{position:absolute;object-fit:fill;border-radius:2px;
  box-shadow:0 0 0 1px rgba(198,150,63,.35),0 14px 40px rgba(0,0,0,.5);will-change:opacity,transform}
.sviluppo .riga{position:absolute;left:0;right:0;height:34%;z-index:5;will-change:transform;
  background:linear-gradient(180deg,transparent,rgba(198,150,63,.10) 45%,rgba(244,237,226,.16) 50%,
             rgba(198,150,63,.10) 55%,transparent)}
.sviluppo .velo{position:absolute;inset:0;background:rgba(16,13,10,.55);will-change:opacity}
.passo{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:12px 14px;
  background:linear-gradient(0deg,rgba(16,13,10,.86),transparent);
  display:flex;align-items:baseline;gap:10px;font-family:var(--f-num);font-size:11px;color:var(--ink-2)}
:root[data-theme="light"] .passo{background:linear-gradient(0deg,rgba(233,230,223,.9),transparent)}
.passo b{color:var(--ink);font-weight:500;font-size:13px}
.passo .barra{flex:1;height:1px;background:var(--line);position:relative;overflow:hidden}
.passo .barra i{position:absolute;inset:0;background:var(--brass);transform-origin:left;
  transform:scaleX(0);will-change:transform}

/* ---------- slot ---------- */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.slot{position:relative;aspect-ratio:1;border:1px solid var(--line-soft);border-radius:4px;
  background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--ink-3);will-change:transform}
.slot.pieno{border-color:var(--line);background:var(--surface);color:var(--ink-2)}
.slot.attratto{border-color:var(--brass);background:var(--surface-2)}
.slot img{width:100%;height:64%;min-width:0;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.slot .k{font-family:var(--f-num);font-size:8.5px;text-transform:uppercase;letter-spacing:.12em}
.slot .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--line);font-size:12px;display:flex;
  align-items:center;justify-content:center;color:var(--ink-2)}

/* ---------- capi ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;
  color:var(--ink-2);will-change:transform}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip .n{font-family:var(--f-num);font-size:10px;opacity:.6;margin-left:6px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media(min-width:1000px){ .rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));overflow:visible} }
.card{flex:0 0 auto;width:104px;text-align:left;touch-action:pan-y;will-change:transform}
@media(min-width:1000px){ .card{width:auto} }
.card .art{position:relative;aspect-ratio:4/5;border:1px solid var(--line-soft);border-radius:4px;
  background:radial-gradient(120% 80% at 50% 18%,var(--surface-2),var(--surface) 55%,var(--sunk));
  overflow:hidden;display:flex;align-items:center;justify-content:center;will-change:transform}
.card .art img{width:100%;height:100%;min-width:0;object-fit:contain;padding:12%;filter:var(--sh-art);
  will-change:transform}
.card.presa .art{opacity:.28}
.card .n{font-size:12.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:16px}
.ghost{position:fixed;left:0;top:0;width:120px;height:120px;object-fit:contain;pointer-events:none;
  z-index:300;filter:var(--sh-art);will-change:transform}

/* ---------- controlli ---------- */
.row{display:flex;align-items:center;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  border-radius:99px;padding:11px 18px;font-size:14px;min-height:44px;color:var(--ink);
  text-decoration:none;cursor:pointer;will-change:transform;
  transition:background .2s var(--quart),border-color .2s var(--quart),opacity .2s}
.btn:hover{border-color:var(--ink-3);background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:500}
.btn.primary:hover{background:#fff;border-color:#fff}
:root[data-theme="light"] .btn.primary:hover{background:#000;border-color:#000}
.btn.small{padding:7px 13px;min-height:36px;font-size:12.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.34;pointer-events:none}
.sub{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:9px;
  letter-spacing:.06em}
.title{font-family:var(--f-display);font-size:clamp(30px,5vw,46px);margin:0 0 2px;line-height:1.06}
.vuoto{border:1px dashed var(--line);border-radius:6px;padding:40px 22px;text-align:center;color:var(--ink-2)}
.field{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:4px;
  padding:11px 13px;color:var(--ink);font:inherit;font-size:13.5px}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- figure ---------- */
.figure{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.figure::-webkit-scrollbar{display:none}
.miniatura{flex:none;width:38px;height:50px;border-radius:3px;overflow:hidden;border:1px solid var(--line);
  background:var(--sunk);position:relative;will-change:transform}
.miniatura img{width:100%;height:100%;object-fit:cover}
.miniatura[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}

/* ---------- coda ---------- */
.coda{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:150;width:min(560px,92vw);
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.job{pointer-events:auto;display:flex;align-items:center;gap:11px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:11px 14px;box-shadow:var(--sh-pop);font-size:13px;
  will-change:transform,opacity}
.job.err{border-color:var(--err);background:var(--err-bg)}
.job .puls{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none;will-change:transform,opacity}
.job .bar{flex:1;min-width:0;height:1px;background:var(--line);position:relative;overflow:hidden}
.job .bar i{position:absolute;inset:0;background:var(--brass);transform-origin:left;transform:scaleX(0);
  will-change:transform}

/* ---------- fogli ---------- */
.velo{position:fixed;inset:0;background:rgba(8,6,4,.62);z-index:180;display:flex;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);will-change:opacity}
@media(min-width:900px){ .velo{align-items:center} }
.foglio{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;
  width:min(620px,100%);max-height:88dvh;overflow:auto;padding:22px var(--pad) 28px;
  box-shadow:var(--sh-pop);will-change:transform}
@media(min-width:900px){ .foglio{border-radius:12px} }
.foglio h2{font-family:var(--f-display);font-size:26px;margin:0}
.foglio-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:13px}
.dl dt{font-family:var(--f-num);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.dl dd{margin:0;color:var(--ink-2)}
.err-box{background:var(--err-bg);border:1px solid var(--err);border-radius:6px;padding:11px 13px;
  font-size:13px;color:var(--ink);margin-bottom:14px}
.tessere{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.tessera{border:1px solid var(--line);border-radius:6px;padding:11px;text-align:left;font-size:12.5px;
  background:var(--sunk);will-change:transform}
.tessera[aria-pressed="true"]{border-color:var(--brass);background:var(--surface-2)}
.tessera b{display:block;font-size:13px;margin-bottom:2px}
.tessera span{color:var(--ink-3);font-size:11px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>

 },

const LINGUE=[['it','Italiano'],['en','English']];
const linguaIniziale=()=>{ const s=localStorage.getItem('vesta.lang');
  return (s&&DIZ[s])?s:((navigator.language||'en').toLowerCase().startsWith('it')?'it':'en'); };

/* ------------------------------------------------------------- costanti */
const SLOTS=['upper','lower','overall','shoes'];
const CAT_KEYS=['upper','lower','overall','outerwear','shoes','accessory'];
const APPIGLI={upper:[.20,.20,.80,.58],lower:[.22,.48,.78,.96],overall:[.18,.19,.82,.92],
  outerwear:[.16,.19,.84,.64],shoes:[.32,.88,.68,1],accessory:[.40,.09,.60,.28]};
const Z={overall:2,upper:3,outerwear:4,lower:1,shoes:1,accessory:5};
const SCENE={
  camerino:{grade:'contrast(1.04) saturate(1.02) brightness(.99)', fondo:'#16130F', vig:.42},
  studio:{grade:'contrast(.98) saturate(.96) brightness(1.05)', fondo:'#E9E6DF', vig:.08},
  pellicola:{grade:'contrast(1.16) saturate(.88) sepia(.10)', fondo:'#12100D', vig:.55},
  originale:{grade:'none', fondo:'#000000', vig:0},
};
const FORMATI={naturale:null, quadrato:1, ritratto:4/5, storia:9/16};
const buzz=(ms=8)=>{ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} };
const API=(p)=>p;

/* ------------------------------------------------------ palco: luce viva */
function usaLuce(ref){
  useEffect(()=>{
    const el=ref.current; if(!el||motoRidotto()) return;
    const luce=el.querySelector('.luce'); if(!luce) return;
    let t=0;
    return ogniFrame((dt)=>{
      t+=dt;
      // due seni incommensurabili: il giro non si ripete mai uguale
      const x=Math.sin(t*0.19)*7+Math.sin(t*0.07)*3;
      const y=Math.cos(t*0.13)*5+Math.sin(t*0.05)*2;
      const s=1+Math.sin(t*0.11)*0.05;
      luce.style.transform=`translate3d(${x}%,${y}%,0) scale(${s})`;
    });
  },[]);
}

/* --------------------------------------------- interruttore che scivola */
function usaCursore(ref, indice, quanti){
  useEffect(()=>{
    const cont=ref.current; if(!cont) return;
    const cur=cont.querySelector('.cursore');
    const bottoni=[...cont.querySelectorAll('button')];
    const b=bottoni[indice]; if(!cur||!b) return;
    const mx=new Molla(b.offsetLeft, MOLLE.pronta), mw=new Molla(b.offsetWidth, MOLLE.pronta);
    mx.x=parseFloat(cur.dataset.x||b.offsetLeft); mw.x=parseFloat(cur.dataset.w||b.offsetWidth);
    mx.verso(b.offsetLeft); mw.verso(b.offsetWidth);
    return ogniFrame((dt)=>{
      const x=mx.avanza(dt), w=mw.avanza(dt);
      cur.style.transform=`translate3d(${x}px,0,0)`; cur.style.width=w+'px';
      cur.dataset.x=x; cur.dataset.w=w;
      return !(mx.fermo()&&mw.fermo());
    });
  },[indice,quanti]);
}

/* ============================================================ applicazione */
function App(){
  const [lang,setLang]=useState(linguaIniziale);
  const t=useCallback((k,...a)=>{const v=DIZ[lang][k];return typeof v==='function'?v(...a):(v??k);},[lang]);

  const [vista,setVista]=useState('camerino');
  const [tema,setTema]=useState(localStorage.getItem('vesta.tema')||'dark');
  const [qualita,setQualita]=useState(localStorage.getItem('vesta.qualita')||'fast');
  const [scena,setScena]=useState(localStorage.getItem('vesta.scena')||'camerino');
  const [formato,setFormato]=useState('naturale');

  const [online,setOnline]=useState(null);
  const [figure,setFigure]=useState([]);
  const [capi,setCapi]=useState([]);
  const [slots,setSlots]=useState({});
  const [prova,setProva]=useState(null);       // URL del PNG generato
  const [looks,setLooks]=useState(()=>{try{return JSON.parse(localStorage.getItem('vesta.looks')||'[]')}catch(e){return[]}});
  const [gen,setGen]=useState(null);           // {passo,passi,restano,anteprima,guadagno}
  const [lavori,setLavori]=useState([]);
  const [foglio,setFoglio]=useState(null);
  const [filtro,setFiltro]=useState('all');
  const [batch,setBatch]=useState(null);

  const palco=useRef(null); usaLuce(palco);
  const navRef=useRef(null);
  const viste=['camerino','guardaroba','lookbook'];
  usaCursore(navRef, viste.indexOf(vista), viste.length);

  useEffect(()=>{document.documentElement.dataset.theme=tema;localStorage.setItem('vesta.tema',tema);},[tema]);
  useEffect(()=>{document.documentElement.lang=lang;localStorage.setItem('vesta.lang',lang);},[lang]);
  useEffect(()=>{localStorage.setItem('vesta.qualita',qualita);},[qualita]);
  useEffect(()=>{localStorage.setItem('vesta.scena',scena);},[scena]);
  useEffect(()=>{localStorage.setItem('vesta.looks',JSON.stringify(looks.slice(-40)));},[looks]);

  const figura=useMemo(()=>figure.find(f=>f.attiva)||figure[0]||null,[figure]);
  const pieni=Object.entries(slots).filter(([k,v])=>v);
  const mostrati=filtro==='all'?capi:capi.filter(c=>c.category===filtro);
  const conteggi=capi.reduce((a,c)=>{a[c.category]=(a[c.category]||0)+1;return a;},{});

  /* ---- caricamento ---- */
  const ricarica=useCallback(async()=>{
    try{
      const [h,f,w]=await Promise.all([
        fetch(API('/health')).then(r=>r.json()),
        fetch(API('/api/figures')).then(r=>r.json()),
        fetch(API('/api/wardrobe')).then(r=>r.json()),
      ]);
      setOnline(h.status==='ok'); setFigure(f.items||[]); setCapi(w.items||[]);
    }catch(e){ setOnline(false); }
  },[]);
  useEffect(()=>{ricarica();},[ricarica]);
  useEffect(()=>{const s=rivela(document);return s;},[vista,mostrati.length,looks.length]);

  /* ---- lavori ---- */
  const job=(testo)=>{const id='j'+Date.now()+Math.random();
    setLavori(l=>[...l,{id,testo,t0:Date.now(),sec:0}]);return id;};
  const jobFine=(id,err)=>{ if(err){setLavori(l=>l.map(x=>x.id===id?{...x,err}:x));
      setTimeout(()=>setLavori(l=>l.filter(x=>x.id!==id)),8000);}
    else setLavori(l=>l.filter(x=>x.id!==id)); };
  useEffect(()=>{ if(!lavori.length) return;
    const i=setInterval(()=>setLavori(l=>l.map(x=>x.err?x:{...x,sec:Math.round((Date.now()-x.t0)/1000)})),1000);
    return ()=>clearInterval(i); },[lavori.length]);

  /* ---- capi ---- */
  function metti(c){
    const cat=(c.category==='outerwear'||c.category==='accessory')?'upper':c.category;
    setSlots(s=>{const n={...s,[cat]:c};
      if(cat==='overall'){n.upper=null;n.lower=null;}
      if(cat==='upper'||cat==='lower') n.overall=null;
      return n;});
    setProva(null); buzz();
  }
  const appiglio=(cat)=>{
    const a=figura?.anchors||{};
    const m=cat==='outerwear'?a.upper:a[cat];
    return (m&&m.length===4)?m:(APPIGLI[cat]||APPIGLI.upper);
  };

  /* ---- generazione dal vivo ---- */
  const fermaRef=useRef(null);
  async function generaProva(){
    if(!figura){ setFoglio({k:'figure'}); return; }
    const capo=slots.overall||slots.upper||slots.lower||slots.shoes;
    if(!capo) return;
    setProva(null);
    setGen({passo:0,passi:30,restano:75,anteprima:null,guadagno:1});
    const id=job(t('gen_avvio'));
    try{
      const fp=await fetch(API(`/api/figures/${figura.id}/photo`)).then(r=>r.blob());
      const cp=await fetch(capo.url||`/wardrobe/${capo.id}.png`).then(r=>r.blob());
      const fd=new FormData();
      fd.append('person',fp,'p.jpg'); fd.append('cloth',cp,'c.png');
      fd.append('category',slots.overall?'overall':(slots.lower&&!slots.upper?'lower':'upper'));
      fd.append('quality',qualita);
      const av=await fetch(API('/api/tryon/start'),{method:'POST',body:fd}).then(r=>r.json());
      if(av.error) throw new Error(av.error);
      jobFine(id);
      setGen(g=>({...(g||{}),riquadro:av.riquadro,passi:av.passi,guadagno:av.guadagno}));

      await new Promise((ok,ko)=>{
        const es=new EventSource(API(`/api/tryon/stream/${av.id}`));
        fermaRef.current=()=>{es.close();ko(new Error('fermato'));};
        es.onmessage=(m)=>{
          const d=JSON.parse(m.data);
          setGen(g=>({...(g||{}),...d, anteprima:d.anteprima??g?.anteprima}));
          if(d.stato==='finito'){es.close();ok();}
          if(d.stato==='errore'){es.close();ko(new Error(d.errore||'errore'));}
        };
        es.onerror=()=>{es.close();ko(new Error('flusso interrotto'));};
      });

      const png=await fetch(API(`/api/tryon/result/${av.id}`)).then(r=>r.blob());
      setProva(URL.createObjectURL(png));
      buzz(20);
    }catch(e){ if(e.message!=='fermato') jobFine(id,e.message); else jobFine(id); }
    finally{ setGen(null); fermaRef.current=null; }
  }

  /* ---- coda su tutto il guardaroba ---- */
  const stopBatch=useRef(false);
  async function preparaTutti(){
    if(!figura){ setFoglio({k:'figure'}); return; }
    const lista=capi.filter(c=>['upper','overall','lower'].includes(c.category));
    if(!lista.length) return;
    stopBatch.current=false;
    setBatch({fatti:0,inCorso:1,totale:lista.length,fermando:false});
    const fp=await fetch(API(`/api/figures/${figura.id}/photo`)).then(r=>r.blob());
    for(let i=0;i<lista.length;i++){
      if(stopBatch.current) break;
      const c=lista[i];
      setBatch(b=>({...b,inCorso:i+1}));
      try{
        const cp=await fetch(c.url||`/wardrobe/${c.id}.png`).then(r=>r.blob());
        const fd=new FormData();
        fd.append('person',fp,'p.jpg'); fd.append('cloth',cp,'c.png');
        fd.append('category',c.category==='overall'?'overall':(c.category==='lower'?'lower':'upper'));
        fd.append('quality',qualita); fd.append('garment_id',c.id||'');
        await fetch(API('/tryon'),{method:'POST',body:fd});
      }catch(e){}
      setBatch(b=>({...b,fatti:i+1}));
    }
    setBatch(b=>b&&{...b,finita:true});
    setTimeout(()=>setBatch(null),3000);
  }

  /* ---- composizione, formati, clip ---- */
  const telaLook=useCallback(async(rapporto)=>{
    const S=SCENE[scena]||SCENE.camerino;
    const sorgente=prova||(figura?API(`/api/figures/${figura.id}/photo`):null);
    if(!sorgente) return null;
    const bmp=await createImageBitmap(await (await fetch(sorgente)).blob());
    let W=bmp.width,H=bmp.height;
    if(rapporto){ if(W/H>rapporto) W=Math.round(H*rapporto); else H=Math.round(W/rapporto); }
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const g=c.getContext('2d');
    g.fillStyle=S.fondo; g.fillRect(0,0,W,H);
    g.filter=S.grade;
    const s=Math.max(W/bmp.width,H/bmp.height);
    g.drawImage(bmp,(W-bmp.width*s)/2,(H-bmp.height*s)/2,bmp.width*s,bmp.height*s);
    g.filter='none';
    if(!prova){  // niente prova: appoggia i capi come nel montaggio
      for(const [k,c2] of pieni){
        const a=appiglio(c2.category);
        const im=await createImageBitmap(await (await fetch(c2.url||`/wardrobe/${c2.id}.png`)).blob());
        const bw=(a[2]-a[0])*W, bh=(a[3]-a[1])*H, kk=Math.min(bw/im.width,bh/im.height);
        g.drawImage(im,a[0]*W+(bw-im.width*kk)/2,a[1]*H,im.width*kk,im.height*kk);
      }
    }
    if(S.vig>0){
      const v=g.createRadialGradient(W/2,H*0.44,Math.min(W,H)*0.28,W/2,H*0.5,Math.max(W,H)*0.78);
      v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,`rgba(0,0,0,${S.vig})`);
      g.fillStyle=v; g.fillRect(0,0,W,H);
    }
    return c;
  },[prova,figura,scena,pieni]);

  async function esportaFormato(nome){
    const c=await telaLook(FORMATI[nome]); if(!c) return;
    const b=await new Promise(r=>c.toBlob(r,'image/png'));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=`vesta-${nome}.png`; a.click();
    buzz(14);
  }

  async function salvaLook(){
    const c=await telaLook(null); if(!c) return;
    setLooks(l=>[...l,{id:'l'+Date.now(),url:c.toDataURL('image/jpeg',.86),
      capi:pieni.map(([k,v])=>v.label),quando:Date.now()}]);
    buzz(14);
  }

  /** La clip: dieci secondi che vanno dal montaggio alla prova, registrati su tela. */
  async function registraClip(){
    const c=await telaLook(9/16); if(!c) return;
    const id=job(t('clip_corso'));
    try{
      const W=c.width,H=c.height;
      const tela=document.createElement('canvas'); tela.width=W; tela.height=H;
      const g=tela.getContext('2d');
      const fondo=await createImageBitmap(c);
      const stream=tela.captureStream(30);
      const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm']
        .find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'video/webm';
      const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6_000_000});
      const pezzi=[]; rec.ondataavailable=e=>e.data.size&&pezzi.push(e.data);
      const finito=new Promise(r=>rec.onstop=r);
      rec.start();
      const T=9000, t0=performance.now();
      await new Promise(fine=>{
        ogniFrame(()=>{
          const p=Math.min(1,(performance.now()-t0)/T);
          const e=1-Math.pow(1-p,3);
          const zoom=1.06-0.06*e;                    // carrellata lenta in avanti
          const dy=(1-e)*H*0.012;
          g.fillStyle=SCENE[scena].fondo; g.fillRect(0,0,W,H);
          g.save(); g.translate(W/2,H/2); g.scale(zoom,zoom); g.translate(-W/2,-H/2+dy);
          g.drawImage(fondo,0,0,W,H); g.restore();
          // la riga di sviluppo passa una volta sola, nel primo terzo
          if(p<0.34){ const y=(p/0.34)*H;
            const gr=g.createLinearGradient(0,y-H*0.16,0,y+H*0.16);
            gr.addColorStop(0,'rgba(198,150,63,0)'); gr.addColorStop(.5,'rgba(244,237,226,.16)');
            gr.addColorStop(1,'rgba(198,150,63,0)');
            g.fillStyle=gr; g.fillRect(0,y-H*0.16,W,H*0.32); }
          if(p>=1){ fine(); return false; }
          return true;
        });
      });
      rec.stop(); await finito;
      const blob=new Blob(pezzi,{type:mime});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='vesta-look.'+(mime.includes('mp4')?'mp4':'webm'); a.click();
      jobFine(id); buzz(20);
    }catch(e){ jobFine(id,e.message); }
  }

  /* ---- guardaroba: import, export, foto ---- */
  async function aggiungiFoto(files){
    const lista=[...files].slice(0,8); if(!lista.length) return;
    setFoglio(null);
    const fd=new FormData(); lista.forEach(f=>fd.append('photos',f));
    const id=job(t('im_titolo'));
    try{
      const r=await fetch(API('/api/import'),{method:'POST',body:fd}).then(r=>r.json());
      const jid=r.job||r.id;
      if(jid){ for(let i=0;i<600;i++){
        await new Promise(s=>setTimeout(s,1200));
        const st=await fetch(API(`/api/jobs/${jid}`)).then(r=>r.json());
        if(st.done||st.stato==='finito'||st.status==='done') break; } }
      await ricarica(); jobFine(id); buzz(14);
    }catch(e){ jobFine(id,e.message); }
  }

  async function nuovaFigura(file,nome){
    const fd=new FormData(); fd.append('photo',file); fd.append('nome',nome||'');
    const id=job(t('fig_nuova'));
    try{ await fetch(API('/api/figures'),{method:'POST',body:fd}); await ricarica(); jobFine(id); }
    catch(e){ jobFine(id,e.message); }
  }

  /* ------------------------------------------------------------ palco */
  const trascinamento=useDrag({palco,slots,metti,pieni});

  const vistaPalco=html`
    <div class="stage ${trascinamento.sopra?'calda':''}" ref=${palco}>
      <div class="luce"></div><div class="alone"></div>
      <div class="filo" style=${gen?`transform:scaleX(${(gen.passo||0)/(gen.passi||30)})`:''}></div>

      ${figura?html`
        <div class="fig">
          <img class="base" src=${prova||API(`/api/figures/${figura.id}/photo`)} alt=""
               style=${`filter:${(SCENE[scena]||SCENE.camerino).grade}`} />
          ${!prova&&!gen?pieni.map(([k,c])=>{const a=appiglio(c.category);
            return html`<${Strato} key=${c.id} capo=${c} box=${a} />`;}):null}
          ${gen?html`<${Sviluppo} gen=${gen} />`:null}
        </div>`
      :html`<div class="vuota">
          <svg viewBox="0 0 100 200" width="108" height="216" aria-hidden="true">
            <circle cx="50" cy="26" r="18" fill="currentColor"/>
            <path d="M28 50h44l8 60H20zM30 110h16l-4 78H26zM54 110h16l4 78H58z" fill="currentColor"/></svg>
          <p class="hint" style="margin:14px auto 12px">${t('fig_invito')}</p>
          <button class="btn primary" onClick=${()=>setFoglio({k:'figure'})}>${t('fig_aggiungi')}</button>
        </div>`}

      <span class="tag">${gen?t('t_sviluppo'):prova?t('t_prova'):pieni.length?t('t_montaggio'):t('t_camerino')}</span>
      <div class="corner">
        ${prova?html`<button class="btn small" onClick=${()=>setProva(null)}>${t('originale')}</button>`:null}
        ${figura?html`<button class="btn small" onClick=${()=>setFoglio({k:'figure'})}>${t('fig_cambia')}</button>`:null}
      </div>
      ${gen?html`<div class="passo">
        <b>${gen.passo||0}</b><span>/ ${gen.passi||30} ${t('gen_passo')}</span>
        <span class="barra"><i style=${`transform:scaleX(${(gen.passo||0)/(gen.passi||30)})`}></i></span>
        <span>${Math.max(0,Math.round(gen.restano||0))}s ${t('gen_restano')}</span>
        ${gen.guadagno>1.2?html`<span>· ${gen.guadagno}x ${t('gen_pixel')}</span>`:null}
      </div>`:null}
    </div>`;

  const camerino=html`
    <div class="view">
      <div class="room">
        <div class="left">
          ${vistaPalco}
          <div class="slots">
            ${SLOTS.map(k=>{const c=slots[k];
              return html`<${Slot} key=${k} nome=${t('slot_'+k)} capo=${c} attratto=${trascinamento.bersaglio===k}
                onVuota=${()=>{setSlots(s=>({...s,[k]:null}));setProva(null);buzz();}}
                onClick=${()=>!c&&setVista('guardaroba')} />`;})}
          </div>
          <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">
            ${gen
              ?html`<button class="btn wide" onClick=${()=>fermaRef.current?.()}>${t('ferma')}</button>`
              :html`<button class="btn primary" style="flex:1;min-width:170px"
                     disabled=${!pieni.length||!figura} onClick=${generaProva}>${t('genera')}</button>`}
            ${pieni.length&&!gen?html`<button class="btn small"
              onClick=${()=>{setSlots({});setProva(null);buzz();}}>${t('svuota')}</button>`:null}
            ${(prova||pieni.length)&&!gen?html`<button class="btn small" onClick=${salvaLook}>${t('salva')}</button>`:null}
          </div>

/* ----------------------------------------------------- pezzi animati */
function Pulsante(){
  const r=useRef(null);
  useEffect(()=>{ if(motoRidotto())return; let t=0;
    return ogniFrame((dt)=>{ t+=dt;
      const s=1+Math.sin(t*4.2)*0.34, o=0.55+Math.sin(t*4.2)*0.42;
      if(r.current){r.current.style.transform=`scale(${s})`;r.current.style.opacity=o;}
    }); },[]);
  return html`<span class="puls" ref=${r}></span>`;
}

/** Il capo che cade addosso: pendolo smorzato, non un fotogramma chiave. */
function Strato({capo,box}){
  const r=useRef(null);
  useEffect(()=>{
    const el=r.current; if(!el) return;
    if(motoRidotto()){ el.style.opacity=1; return; }
    const y=new Molla(-26,MOLLE.elastica).verso(0);
    const rot=new Molla(-4.5,{k:260,c:11,m:1}).verso(0);
    const op=new Molla(0,MOLLE.dolce).verso(1);
    return ogniFrame((dt)=>{
      const yy=y.avanza(dt), rr=rot.avanza(dt), oo=op.avanza(dt);
      el.style.transform=`translate3d(0,${yy}px,0) rotate(${rr}deg)`;
      el.style.opacity=oo;
      return !(y.fermo()&&rot.fermo()&&op.fermo());
    });
  },[capo.id]);
  return html`<img class=${'layer '+capo.category} ref=${r} src=${capo.url||`/wardrobe/${capo.id}.png`} alt=""
    style=${`left:${box[0]*100}%;top:${box[1]*100}%;width:${(box[2]-box[0])*100}%;height:${(box[3]-box[1])*100}%;z-index:${Z[capo.category]||2};opacity:0`} />`;
}

/** Lo sviluppo: l'anteprima del latente in dissolvenza, piu' la riga che scorre. */
function Sviluppo({gen}){
  // il riquadro dove il modello sta lavorando, in percentuale della figura
  const q=gen.riquadro||[0,0,1,1];
  const posa={left:q[0]*100+'%',top:q[1]*100+'%',
    width:(q[2]-q[0])*100+'%',height:(q[3]-q[1])*100+'%'};
  const img=useRef(null), riga=useRef(null), velo=useRef(null);
  const [mostrata,setMostrata]=useState(null);
  useEffect(()=>{ if(gen.anteprima&&gen.anteprima!==mostrata) setMostrata(gen.anteprima); },[gen.anteprima]);
  useEffect(()=>{
    if(motoRidotto()) return;
    let t=0;
    return ogniFrame((dt)=>{
      t+=dt;
      if(riga.current){
        const p=(t*0.42)%1;                       // una passata ogni 2,4 secondi
        riga.current.style.transform=`translate3d(0,${(p*140-20)}%,0)`;
      }
      if(velo.current){
        // il velo si alza col progresso: a fine corsa l'immagine e' scoperta
        const q=Math.min(1,(gen.passo||0)/(gen.passi||30));
        velo.current.style.opacity=String(0.5*(1-q)+0.06*Math.sin(t*2.1)*(1-q));
      }
    });
  },[gen.passo,gen.passi]);
  useEffect(()=>{
    const el=img.current; if(!el||!mostrata) return;
    if(motoRidotto()){el.style.opacity=1;return;}
    const op=new Molla(0,MOLLE.dolce).verso(1);
    const sc=new Molla(1.03,MOLLE.dolce).verso(1);
    return ogniFrame((dt)=>{
      const o=op.avanza(dt), s=sc.avanza(dt);
      el.style.opacity=o; el.style.transform=`scale(${s})`;
      return !(op.fermo()&&sc.fermo());
    });
  },[mostrata]);
  return html`<div class="sviluppo">
    ${mostrata?html`<img class="anteprima" ref=${img} src=${mostrata} alt=""
      style=${{opacity:0,...posa}} />`:null}
    <div class="velo" ref=${velo}></div>
    <div class="riga" ref=${riga}></div>
  </div>`;
}

function Slot({nome,capo,attratto,onVuota,onClick}){
  const r=useRef(null);
  useEffect(()=>{
    const el=r.current; if(!el||motoRidotto()) return;
    const s=new Molla(1,MOLLE.pronta).verso(attratto?1.09:1, attratto?1.6:0);
    return ogniFrame((dt)=>{ const v=s.avanza(dt);
      el.style.transform=`scale(${v})`; return !s.fermo(); });
  },[attratto]);
  useEffect(()=>{
    const el=r.current; if(!el||motoRidotto()||!capo) return;
    const s=new Molla(0.84,MOLLE.elastica).verso(1);
    return ogniFrame((dt)=>{ const v=s.avanza(dt);
      el.style.transform=`scale(${v})`; return !s.fermo(); });
  },[capo?.id]);
  return html`<button class=${'slot'+(capo?' pieno':'')+(attratto?' attratto':'')} ref=${r}
    onClick=${()=>capo?null:onClick()} title=${nome}>
    ${capo?html`<img src=${capo.url||`/wardrobe/${capo.id}.png`} alt="" />`
          :html`<span style="font-size:17px">+</span>`}
    <span class="k">${nome}</span>
    ${capo?html`<span class="x" onClick=${e=>{e.stopPropagation();onVuota();}}>×</span>`:null}
  </button>`;
}

function Carta({capo,drag,griglia,onApri,onClick}){
  const r=useRef(null), art=useRef(null);
  useEffect(()=>{
    const el=art.current; if(!el||motoRidotto()) return;
    let dentro=false;
    const s=new Molla(1,MOLLE.pronta), y=new Molla(0,MOLLE.pronta);
    let stop=null;
    const anima=()=>{ stop?.(); stop=ogniFrame((dt)=>{
      const sv=s.avanza(dt), yv=y.avanza(dt);
      el.style.transform=`translate3d(0,${yv}px,0) scale(${sv})`;
      return !(s.fermo()&&y.fermo()); }); };
    const ent=()=>{dentro=true;s.verso(1.03);y.verso(-5);anima();};
    const esc=()=>{dentro=false;s.verso(1);y.verso(0);anima();};
    el.parentElement.addEventListener('pointerenter',ent);
    el.parentElement.addEventListener('pointerleave',esc);
    return ()=>{stop?.();el.parentElement?.removeEventListener('pointerenter',ent);
      el.parentElement?.removeEventListener('pointerleave',esc);};
  },[]);
  const p=drag?drag.gestori(capo):{};
  return html`<button class="card" data-rivela ref=${r} style=${griglia?'width:auto':''}
      ...${p}
      onClick=${onClick?()=>onClick():undefined}
      onContextMenu=${e=>{e.preventDefault();onApri();}}
      onDblClick=${()=>onApri()}>
    <div class="art" ref=${art}><img src=${capo.url||`/wardrobe/${capo.id}.png`} alt=${capo.label} draggable="false" /></div>
    <div class="n">${capo.label}</div>
  </button>`;
}

/* ----------------------------------------------------- trascinamento */
function useDrag({palco,slots,metti,pieni}){
  const stato=useRef(null);
  const [sopra,setSopra]=useState(false);
  const [bersaglio,setBersaglio]=useState(null);

  const gestori=useCallback((capo)=>{ const g={
    onPointerDown(e){
      if(e.button!==undefined&&e.button!==0) return;
      const carta=e.currentTarget;
      const im=carta.querySelector('img');
      const g=document.createElement('img');
      g.src=im.src; g.className='ghost';
      document.body.appendChild(g);
      carta.classList.add('presa');
      try{ carta.setPointerCapture(e.pointerId); }catch(_){}   // puntatore gia' rilasciato: non e' un errore

      const molla=new Molla2(e.clientX-60,e.clientY-60,{k:520,c:26,m:1});
      const tr=traccia(); tr.inizia(e.clientX,e.clientY);
      const rot=new Molla(0,{k:180,c:14,m:1});
      const sc=new Molla(0.7,MOLLE.elastica).verso(1.06);

      const stop=ogniFrame((dt)=>{
        const [x,y]=molla.avanza(dt);
        const [vx]=tr.velocita;
        rot.verso(Math.max(-16,Math.min(16,vx*0.022)));
        const rr=rot.avanza(dt), ss=sc.avanza(dt);
        g.style.transform=`translate3d(${x}px,${y}px,0) rotate(${rr}deg) scale(${ss})`;
        return !!stato.current;
      });
      stato.current={capo,g,carta,molla,tr,mosso:false,stop};
      buzz(6);
    },
    onPointerMove(e){
      const s=stato.current; if(!s) return;
      s.mosso=true;
      s.tr.muovi(e.clientX,e.clientY);
      s.molla.verso(e.clientX-60,e.clientY-60);
      const st=palco.current;
      if(st){ const r=st.getBoundingClientRect();
        const dentro=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom;
        setSopra(dentro);
      }
      // lo slot piu' vicino si gonfia e attira
      let vicino=null,dmin=1e9;
      document.querySelectorAll('.slot').forEach((el,i)=>{
        const r=el.getBoundingClientRect();
        const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
        if(d<dmin){dmin=d;vicino=SLOTS[i];}
      });
      setBersaglio(dmin<110?vicino:null);
    },
    onPointerUp(e){
      const s=stato.current; if(!s) return;
      stato.current=null; s.stop?.();
      s.carta.classList.remove('presa');
      const st=palco.current;
      let cade=false;
      if(st){ const r=st.getBoundingClientRect();
        cade=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom; }
      const suSlot=(()=>{ let v=null,d=1e9;
        document.querySelectorAll('.slot').forEach((el)=>{ const r=el.getBoundingClientRect();
          const dd=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
          if(dd<d){d=dd;v=dd<90;} }); return v; })();
      setSopra(false); setBersaglio(null);
      if(cade||suSlot||!s.mosso) metti(s.capo);
      // il fantasma vola via con la velocita' che aveva, non sparisce e basta
      const [vx,vy]=s.tr.velocita;
      const fant=s.g;
      let x=e.clientX-60, y=e.clientY-60;
      let ax=vx, ay=vy, o=1;
      ogniFrame((dt)=>{
        ax*=0.90; ay*=0.90; x+=ax*dt; y+=ay*dt; o-=dt*3.6;
        fant.style.transform=`translate3d(${x}px,${y}px,0) scale(${0.6+o*0.5})`;
        fant.style.opacity=Math.max(0,o);
        if(o<=0){ fant.remove(); return false; }
        return true;
      });
    },
  };
  // con le prop sparse `this` dentro il gestore non e' questo oggetto: lego per nome
  g.onPointerCancel = g.onPointerUp;
  return g; },[metti]);

  return {gestori,sopra,bersaglio};
}

  const testa=(x)=>html`<div class="foglio-h"><h2>${x}</h2>
    <button class="btn small" onClick=${chiudi}>${t('chiudi')}</button></div>`;

          <span class="btn small" onClick=${async e=>{e.stopPropagation();

        ${c.color_name?html`<dt>${t('ca_colore')}</dt><dd>${c.color_name}</dd>`:null}
        ${(c.material||c.silhouette||c.construction)?html`<dt>${t('ca_osservato')}</dt>
          <dd>${[c.material,c.silhouette,c.construction].filter(Boolean).join(' · ')}</dd>`:null}
        ${c.description?html`<dt>${t('ca_nota')}</dt><dd>${c.description}</dd>`:null}
        ${c.qa&&!c.qa.ok?html`<dt>${t('ca_rivedere')}</dt><dd>${(c.qa.problems||[]).join(', ')}</dd>`:null}
      </dl>
      <div style="margin-top:18px">
        <div class="meta" style="margin-bottom:6px">${t('ca_nome')}</div>
        <div class="row">
          <input class="field" id="nomeCapo" value=${c.label} />
          <button class="btn small" onClick=${async(e)=>{
            const v=e.target.closest('.row').querySelector('input').value.trim();
            if(!v) return;
            const fd=new FormData(); fd.append('label',v);
            await fetch(`/api/wardrobe/${c.id}`,{method:'POST',body:fd});
            await ctx.ricarica(); chiudi();}}>${t('salva')}</button>
        </div>
        <div class="meta" style="margin:14px 0 6px">${t('ca_categoria')}</div>
        <div class="tessere">
          ${CAT_KEYS.map(k=>html`<button class="tessera" key=${k} aria-pressed=${c.category===k}
            onClick=${async()=>{const fd=new FormData(); fd.append('category',k);
              await fetch(`/api/wardrobe/${c.id}`,{method:'POST',body:fd});
              await ctx.ricarica(); chiudi();}}><b>${t('cat_'+k)}</b></button>`)}
        </div>
      </div>
      <div class="row" style="margin-top:18px;gap:8px">
        <button class="btn primary" onClick=${()=>{ctx.metti(c);ctx.setVista('camerino');chiudi();}}>${t('ca_addosso')}</button>
        <button class="btn" onClick=${async()=>{await fetch(`/api/wardrobe/${c.id}`,{method:'DELETE'});
          await ctx.ricarica();chiudi();}}>${t('elimina')}</button>
      </div>`);
  }

  const gruppo=(titolo,voci,attuale,cambia,desc)=>html`
    <div class="foglio-h" style="margin:20px 0 10px"><h2 style="font-size:17px">${titolo}</h2></div>
    ${desc?html`<p class="hint" style="margin-bottom:10px">${desc}</p>`:null}
    <div class="tessere">
      ${voci.map(([v,nome,sotto])=>html`<button class="tessera" key=${v} aria-pressed=${attuale===v}
        onClick=${()=>cambia(v)}><b>${nome}</b>${sotto?html`<span>${sotto}</span>`:null}</button>`)}
    </div>`;

  return guscio(html`
    ${testa(t('impostazioni'))}
    ${gruppo(t('se_lingua'),LINGUE.map(([c,n])=>[c,n]),ctx.lang,ctx.setLang)}
    ${gruppo(t('se_aspetto'),[['dark',t('se_scuro')],['light',t('se_chiaro')]],ctx.tema,ctx.setTema)}
    ${gruppo(t('se_qualita'),[['fast',t('se_veloce'),'384x512'],['balanced',t('se_media'),'576x768'],
      ['high',t('se_alta'),'768x1024']],ctx.qualita,ctx.setQualita,t('se_qualita_d'))}
    ${gruppo(t('scena'),[['camerino',t('sc_camerino'),t('sc_camerino_d')],
      ['studio',t('sc_studio'),t('sc_studio_d')],['pellicola',t('sc_pellicola'),t('sc_pellicola_d')],
      ['originale',t('sc_originale'),t('sc_originale_d')]],ctx.scena,ctx.setScena,t('scena_spiega'))}
    <div class="foglio-h" style="margin:22px 0 8px"><h2 style="font-size:17px">${t('se_dati')}</h2></div>
    <p class="hint">${t('se_dati_d')}</p>
    <p class="hint" style="margin-top:8px">
      <span class="meta">${t('se_server')}</span> ${ctx.online?'ok':'—'}</p>`);
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
